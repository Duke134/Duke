<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duke Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--text:#1a1d23;--muted:#6b7280;--line:#e5e7eb;--accent:#2f3c7e}
  @media (prefers-color-scheme: dark){:root{--bg:#0f1115;--card:#171a21;--text:#e8eaf0;--muted:#9aa3b2;--line:#262b36;--accent:#8fa3ff}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  .wrap{max-width:900px;margin:0 auto;padding:72px 16px}
  h1{font-size:34px;font-weight:700}
  .sub{color:var(--muted);margin:10px 0 36px}
  .list{display:grid;gap:16px}
  a.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;text-decoration:none;color:inherit;transition:transform .15s}
  a.item:hover{transform:translateY(-2px)}
  a.item h2{font-size:20px;color:var(--accent)}
  a.item p{color:var(--muted);font-size:14px;margin-top:4px}
  .soon{opacity:.55}
</style>
</head>
<body>
<div class="wrap">
  <h1>Duke Lab</h1>
  <p class="sub">양남규의 실험실. 프로필 사이트와 클라우드 세션으로 만든 결과물을 모아 둡니다.</p>
  <div class="list">
    <a class="item" href="site/"><h2>프로필 사이트</h2><p>Finance Operations Specialist 소개, 스킬, 케이스 스터디, 타임라인</p></a>
    <a class="item" href="decks/"><h2>덱 갤러리 — 6가지 디자인</h2><p>같은 포트폴리오 원고를 디자인 시스템 6종으로 만든 13장 덱. 슬라이드 미리보기와 pptx 다운로드</p></a>
  </div>
</div>
</body>
</html>
